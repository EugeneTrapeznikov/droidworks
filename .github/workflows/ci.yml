name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmux/tests/test-patch.sh

  pi-jev-triage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-jev-triage/extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test

  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pi/tests/test-installed-patch.sh

  pi-footer-nerdfonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node pi-footer-nerdfonts/index.ts

  pi-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node pi-update/verify.js

  pi-profiles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-profiles
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun test
